<h2 style="margin-top:0">インストールが完了しました</h2>
<p><b>AutoSculpt 3D</b> はアプリケーションフォルダと Launchpad にあります。</p>
<p>3D モデルを作るには：<b>ファイル → AutoSculpt Studio で 3D モデルを作成…</b>。OBJ、STL、GLB、PLY ファイルも開けます。</p>
<p>アップデートは起動のたびに自動で確認・インストールされます（<b>ツール → 環境設定…</b> で変更可能）。プログラムの言語は Mac の言語に従い、環境設定で変更できます。</p>
